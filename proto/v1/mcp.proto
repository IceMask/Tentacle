// Universal Mobile Testing Platform Protocol
// 通用移动测试平台协议定义
syntax = "proto3";

package umtp.v1;

option go_package = "mcp_for_appium/proto/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// ===== Core Services =====
// 核心服务定义

service DeviceService {
 // Device discovery and management
 rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
 rpc GetDevice(GetDeviceRequest) returns (Device);
 rpc AllocateDevice(AllocateDeviceRequest) returns (AllocateDeviceResponse);
 rpc ReleaseDevice(ReleaseDeviceRequest) returns (google.protobuf.Empty);
 
 // Real-time device monitoring
 rpc StreamDeviceStatus(StreamDeviceStatusRequest) returns (stream DeviceStatusInfo);  // 改为 DeviceStatusInfo
 rpc StreamDeviceMetrics(StreamDeviceMetricsRequest) returns (stream DeviceMetrics);
}

service SessionService {
 // Session lifecycle
 rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
 rpc GetSession(GetSessionRequest) returns (Session);
 rpc EndSession(EndSessionRequest) returns (google.protobuf.Empty);
 rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
 
 // Session state management
 rpc SaveSessionState(SaveSessionStateRequest) returns (google.protobuf.Empty);
 rpc RestoreSessionState(RestoreSessionStateRequest) returns (google.protobuf.Empty);
}

service InteractionService {
 // Element operations
 rpc FindElement(FindElementRequest) returns (FindElementResponse);
 rpc FindElements(FindElementsRequest) returns (FindElementsResponse);
 rpc GetElementInfo(GetElementInfoRequest) returns (ElementInfo);
 
 // Basic interactions
 rpc Tap(TapRequest) returns (TapResponse);
 rpc LongPress(LongPressRequest) returns (LongPressResponse);
 rpc DoubleTap(DoubleTapRequest) returns (DoubleTapResponse);
 rpc InputText(InputTextRequest) returns (InputTextResponse);
 rpc ClearText(ClearTextRequest) returns (ClearTextResponse);
 
 // Gestures
 rpc Swipe(SwipeRequest) returns (SwipeResponse);
 rpc Pinch(PinchRequest) returns (PinchResponse);
 rpc Rotate(RotateRequest) returns (RotateResponse);
 rpc Drag(DragRequest) returns (DragResponse);
 
 // Multi-touch
 rpc MultiTouch(MultiTouchRequest) returns (MultiTouchResponse);
 
 // Continuous interaction stream
 rpc StreamInteractions(stream InteractionCommand) returns (stream InteractionResult);
}

service ScreenService {
 // Screen capture
 rpc TakeScreenshot(TakeScreenshotRequest) returns (Screenshot);
 rpc StartRecording(StartRecordingRequest) returns (RecordingSession);
 rpc StopRecording(StopRecordingRequest) returns (Recording);
 
 // Screen analysis
 rpc GetScreenLayout(GetScreenLayoutRequest) returns (ScreenLayout);
 rpc CompareScreens(CompareScreensRequest) returns (ScreenComparison);
 rpc FindVisualElement(FindVisualElementRequest) returns (FindVisualElementResponse);  // 修复：改为 FindVisualElementResponse
 
 // Real-time screen streaming
 rpc StreamScreen(StreamScreenRequest) returns (stream ScreenFrame);
 rpc StreamLayoutChanges(StreamLayoutChangesRequest) returns (stream LayoutChange);
}

service ApplicationService {
 // App management
 rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
 rpc UninstallApp(UninstallAppRequest) returns (google.protobuf.Empty);
 rpc LaunchApp(LaunchAppRequest) returns (LaunchAppResponse);
 rpc TerminateApp(TerminateAppRequest) returns (google.protobuf.Empty);
 rpc GetAppInfo(GetAppInfoRequest) returns (AppInfo);
 
 // App state
 rpc GetAppState(GetAppStateRequest) returns (AppState);
 rpc ResetApp(ResetAppRequest) returns (google.protobuf.Empty);
 rpc BackupAppData(BackupAppDataRequest) returns (BackupInfo);
 rpc RestoreAppData(RestoreAppDataRequest) returns (google.protobuf.Empty);
}

service TestService {
 // Test execution
 rpc RunTest(RunTestRequest) returns (TestResult);
 rpc RunTestSuite(RunTestSuiteRequest) returns (TestSuiteResult);
 rpc StreamTestExecution(StreamTestExecutionRequest) returns (stream TestEvent);
 
 // Test management
 rpc CreateTestPlan(CreateTestPlanRequest) returns (TestPlan);
 rpc GetTestHistory(GetTestHistoryRequest) returns (TestHistory);
 
 // Batch testing
 rpc RunParallelTests(RunParallelTestsRequest) returns (stream ParallelTestUpdate);
}

service SystemService {
 // Device control
 rpc RotateDevice(RotateDeviceRequest) returns (google.protobuf.Empty);
 rpc SetLocation(SetLocationRequest) returns (google.protobuf.Empty);
 rpc SetNetwork(SetNetworkRequest) returns (google.protobuf.Empty);
 rpc SimulateCall(SimulateCallRequest) returns (google.protobuf.Empty);
 rpc SimulateSMS(SimulateSMSRequest) returns (google.protobuf.Empty);
 
 // System operations
 rpc ExecuteShellCommand(ExecuteShellCommandRequest) returns (ShellCommandResponse);
 rpc GetSystemLogs(GetSystemLogsRequest) returns (stream LogEntry);
 rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (PerformanceMetrics);
}

// ===== Data Models =====
// 数据模型定义

// Device related
message Device {
 string id = 1;
 DeviceType type = 2;
 DeviceStatus status = 3;
 DeviceCapabilities capabilities = 4;
 map<string, string> properties = 5;
 google.protobuf.Timestamp last_seen = 6;
 ResourceUsage resource_usage = 7;
}

enum DeviceType {
 DEVICE_TYPE_UNSPECIFIED = 0;
 DEVICE_TYPE_PHYSICAL = 1;
 DEVICE_TYPE_EMULATOR = 2;
 DEVICE_TYPE_CLOUD = 3;
 DEVICE_TYPE_SIMULATOR = 4;
}

enum DeviceStatus {
 DEVICE_STATUS_UNSPECIFIED = 0;
 DEVICE_STATUS_AVAILABLE = 1;
 DEVICE_STATUS_BUSY = 2;
 DEVICE_STATUS_OFFLINE = 3;
 DEVICE_STATUS_MAINTENANCE = 4;
 DEVICE_STATUS_ERROR = 5;
}

message DeviceCapabilities {
 string platform = 1;  // android, ios
 string platform_version = 2;
 string model = 3;
 string manufacturer = 4;
 ScreenInfo screen = 5;
 repeated string sensors = 6;
 NetworkCapabilities network = 7;
 bool has_camera = 8;
 bool has_keyboard = 9;
 int32 api_level = 10;
 map<string, bool> features = 11;
}

message ScreenInfo {
 int32 width = 1;
 int32 height = 2;
 float density = 3;
 float diagonal_size = 4;
 string orientation = 5;
}

message NetworkCapabilities {
 bool wifi = 1;
 bool cellular = 2;
 bool bluetooth = 3;
 repeated string cellular_types = 4; // 3G, 4G, 5G
}

message ResourceUsage {
 float cpu_percent = 1;
 int64 memory_used_bytes = 2;
 int64 memory_total_bytes = 3;
 int64 storage_used_bytes = 4;
 int64 storage_total_bytes = 5;
 float battery_percent = 6;
 float temperature_celsius = 7;
}

// Session related
message Session {
 string id = 1;
 string device_id = 2;
 string app_id = 3;
 SessionStatus status = 4;
 google.protobuf.Timestamp created_at = 5;
 google.protobuf.Timestamp updated_at = 6;
 map<string, string> capabilities = 7;
 string owner_id = 8;
 map<string, string> metadata = 9;
}

enum SessionStatus {
 SESSION_STATUS_UNSPECIFIED = 0;
 SESSION_STATUS_ACTIVE = 1;
 SESSION_STATUS_IDLE = 2;
 SESSION_STATUS_TERMINATED = 3;
 SESSION_STATUS_ERROR = 4;
}

// Element related
message Element {
 string id = 1;
 string type = 2;
 Rectangle bounds = 3;
 map<string, string> attributes = 4;
 bool visible = 5;
 bool enabled = 6;
 bool selected = 7;
 bool focused = 8;
 repeated Element children = 9;
}

message Rectangle {
 int32 x = 1;
 int32 y = 2;
 int32 width = 3;
 int32 height = 4;
}

message Point {
 int32 x = 1;
 int32 y = 2;
}

message Locator {
 LocatorStrategy strategy = 1;
 string value = 2;
 map<string, string> options = 3;
}

enum LocatorStrategy {
 LOCATOR_STRATEGY_UNSPECIFIED = 0;
 LOCATOR_STRATEGY_ID = 1;
 LOCATOR_STRATEGY_CLASS = 2;
 LOCATOR_STRATEGY_XPATH = 3;
 LOCATOR_STRATEGY_NAME = 4;
 LOCATOR_STRATEGY_ACCESSIBILITY_ID = 5;
 LOCATOR_STRATEGY_CSS = 6;
 LOCATOR_STRATEGY_LINK_TEXT = 7;
 LOCATOR_STRATEGY_PARTIAL_LINK_TEXT = 8;
 LOCATOR_STRATEGY_PREDICATE = 9;
 LOCATOR_STRATEGY_CLASS_CHAIN = 10;
 LOCATOR_STRATEGY_IMAGE = 11;
 LOCATOR_STRATEGY_CUSTOM = 12;
}

// Test related
message TestCase {
 string id = 1;
 string name = 2;
 string description = 3;
 repeated TestStep steps = 4;
 map<string, string> parameters = 5;
 repeated string tags = 6;
 int32 priority = 7;
 google.protobuf.Duration timeout = 8;
}

message TestStep {
 string id = 1;
 string action = 2;
 google.protobuf.Struct parameters = 3;
 repeated Assertion assertions = 4;
 bool continue_on_failure = 5;
 google.protobuf.Duration timeout = 6;
}

message Assertion {
 AssertionType type = 1;
 string target = 2;
 string expected_value = 3;
 string comparison_operator = 4;
}

enum AssertionType {
 ASSERTION_TYPE_UNSPECIFIED = 0;
 ASSERTION_TYPE_ELEMENT_EXISTS = 1;
 ASSERTION_TYPE_ELEMENT_VISIBLE = 2;
 ASSERTION_TYPE_TEXT_EQUALS = 3;
 ASSERTION_TYPE_TEXT_CONTAINS = 4;
 ASSERTION_TYPE_ATTRIBUTE_EQUALS = 5;
 ASSERTION_TYPE_SCREEN_MATCH = 6;
 ASSERTION_TYPE_CUSTOM = 7;
}

// ===== Request/Response Messages =====
// 请求/响应消息定义

// Device Service
message ListDevicesRequest {
 DeviceFilter filter = 1;
 int32 page_size = 2;
 string page_token = 3;
}

message DeviceFilter {
 repeated DeviceType types = 1;
 repeated DeviceStatus statuses = 2;
 string platform = 3;
 string min_version = 4;
 string max_version = 5;
 map<string, string> properties = 6;
 repeated string capabilities = 7;
}

message ListDevicesResponse {
 repeated Device devices = 1;
 string next_page_token = 2;
 int32 total_count = 3;
}

message AllocateDeviceRequest {
 DeviceRequirements requirements = 1;
 google.protobuf.Duration lease_duration = 2;
 AllocationStrategy strategy = 3;
 string requester_id = 4;
 map<string, string> metadata = 5;
}

message DeviceRequirements {
 DeviceType preferred_type = 1;
 string platform = 2;
 string min_version = 3;
 repeated string required_features = 4;
 ScreenRequirements screen = 5;
 ResourceRequirements resources = 6;
}

message ScreenRequirements {
 int32 min_width = 1;
 int32 min_height = 2;
 float min_density = 3;
}

message ResourceRequirements {
 int64 min_memory_bytes = 1;
 int64 min_storage_bytes = 2;
 float min_battery_percent = 3;
}

enum AllocationStrategy {
 ALLOCATION_STRATEGY_UNSPECIFIED = 0;
 ALLOCATION_STRATEGY_FASTEST = 1;
 ALLOCATION_STRATEGY_CHEAPEST = 2;
 ALLOCATION_STRATEGY_BEST_MATCH = 3;
 ALLOCATION_STRATEGY_LOAD_BALANCE = 4;
}

message AllocateDeviceResponse {
 string allocation_id = 1;
 Device device = 2;
 google.protobuf.Timestamp expires_at = 3;
 map<string, string> connection_info = 4;
}

// Session Service
message CreateSessionRequest {
 string device_id = 1;
 string app_id = 2;
 map<string, string> desired_capabilities = 3;
 SessionOptions options = 4;
}

message SessionOptions {
 bool auto_accept_alerts = 1;
 bool auto_dismiss_alerts = 2;
 bool enable_performance_logging = 3;
 bool enable_network_logging = 4;
 bool full_reset = 5;
 bool no_reset = 6;
 google.protobuf.Duration new_command_timeout = 7;
 map<string, string> environment_vars = 8;
}

message CreateSessionResponse {
 Session session = 1;
 map<string, string> actual_capabilities = 2;
}

// Interaction Service
message FindElementRequest {
 string session_id = 1;
 Locator locator = 2;
 string context_element_id = 3;  // for finding within element
 google.protobuf.Duration timeout = 4;
 bool scroll_into_view = 5;
}

message FindElementResponse {
 Element element = 1;
 bool found = 2;
 string error_message = 3;
}

message TapRequest {
 string session_id = 1;
 oneof target {
   string element_id = 2;
   Point coordinates = 3;
 }
 TapOptions options = 4;
}

message TapOptions {
 int32 tap_count = 1;
 google.protobuf.Duration duration = 2;
 float pressure = 3;
}

message TapResponse {
 bool success = 1;
 string error_message = 2;
 google.protobuf.Timestamp executed_at = 3;
}

message SwipeRequest {
 string session_id = 1;
 Point start = 2;
 Point end = 3;
 google.protobuf.Duration duration = 4;
 int32 steps = 5;  // number of interpolation points
}

message MultiTouchRequest {
 string session_id = 1;
 repeated TouchAction actions = 2;
}

message TouchAction {
 string pointer_id = 1;
 TouchActionType type = 2;
 Point position = 3;
 google.protobuf.Duration duration = 4;
 float pressure = 5;
}

enum TouchActionType {
 TOUCH_ACTION_TYPE_UNSPECIFIED = 0;
 TOUCH_ACTION_TYPE_DOWN = 1;
 TOUCH_ACTION_TYPE_MOVE = 2;
 TOUCH_ACTION_TYPE_UP = 3;
 TOUCH_ACTION_TYPE_WAIT = 4;
}

// Screen Service
message TakeScreenshotRequest {
 string session_id = 1;
 ScreenshotOptions options = 2;
}

message ScreenshotOptions {
 string format = 1;  // png, jpeg, webp
 int32 quality = 2;  // for jpeg/webp
 bool include_status_bar = 3;
 Rectangle crop_area = 4;
 repeated string highlight_elements = 5;
}

message Screenshot {
 bytes data = 1;
 string format = 2;
 int32 width = 3;
 int32 height = 4;
 google.protobuf.Timestamp captured_at = 5;
 map<string, string> metadata = 6;
}

message StreamScreenRequest {
 string session_id = 1;
 StreamOptions options = 2;
}

message StreamOptions {
 int32 fps = 1;
 int32 quality = 2;
 bool include_touches = 3;
 string codec = 4;
}

message ScreenFrame {
 bytes data = 1;
 int64 frame_number = 2;
 google.protobuf.Timestamp timestamp = 3;
 repeated TouchPoint active_touches = 4;
}

message TouchPoint {
 string id = 1;
 Point position = 2;
 float pressure = 3;
}

// Test Service
message RunTestRequest {
 string session_id = 1;
 TestCase test_case = 2;
 TestRunOptions options = 3;
}

message TestRunOptions {
 bool collect_screenshots = 1;
 bool collect_performance = 2;
 bool collect_network = 3;
 bool stop_on_failure = 4;
 int32 retry_count = 5;
 map<string, string> variables = 6;
}

message TestResult {
 string test_id = 1;
 TestStatus status = 2;
 google.protobuf.Timestamp started_at = 3;
 google.protobuf.Timestamp completed_at = 4;
 repeated StepResult step_results = 5;
 repeated Screenshot screenshots = 6;
 PerformanceMetrics performance = 7;
 repeated LogEntry logs = 8;
 string error_message = 9;
 string stack_trace = 10;
}

enum TestStatus {
 TEST_STATUS_UNSPECIFIED = 0;
 TEST_STATUS_PASSED = 1;
 TEST_STATUS_FAILED = 2;
 TEST_STATUS_SKIPPED = 3;
 TEST_STATUS_ERROR = 4;
 TEST_STATUS_RUNNING = 5;
}

message StepResult {
 string step_id = 1;
 TestStatus status = 2;
 google.protobuf.Duration duration = 3;
 repeated AssertionResult assertion_results = 4;
 string error_message = 5;
 Screenshot screenshot = 6;
}

message AssertionResult {
 Assertion assertion = 1;
 bool passed = 2;
 string actual_value = 3;
 string message = 4;
}

// System Service
message ExecuteShellCommandRequest {
 string session_id = 1;
 string command = 2;
 repeated string args = 3;
 google.protobuf.Duration timeout = 4;
 bool as_root = 5;
}

message ShellCommandResponse {
 int32 exit_code = 1;
 string stdout = 2;
 string stderr = 3;
 google.protobuf.Duration execution_time = 4;
}

message PerformanceMetrics {
 repeated CPUMetric cpu_metrics = 1;
 repeated MemoryMetric memory_metrics = 2;
 repeated NetworkMetric network_metrics = 3;
 repeated FrameMetric frame_metrics = 4;
 repeated BatteryMetric battery_metrics = 5;
}

message CPUMetric {
 google.protobuf.Timestamp timestamp = 1;
 float usage_percent = 2;
 map<string, float> per_core_usage = 3;
}

message MemoryMetric {
 google.protobuf.Timestamp timestamp = 1;
 int64 used_bytes = 2;
 int64 available_bytes = 3;
 int64 total_bytes = 4;
 map<string, int64> per_process_usage = 5;
}

message NetworkMetric {
 google.protobuf.Timestamp timestamp = 1;
 int64 bytes_sent = 2;
 int64 bytes_received = 3;
 int64 packets_sent = 4;
 int64 packets_received = 5;
 float latency_ms = 6;
}

message FrameMetric {
 google.protobuf.Timestamp timestamp = 1;
 float fps = 2;
 int32 dropped_frames = 3;
 float jank_percentage = 4;
}

message BatteryMetric {
 google.protobuf.Timestamp timestamp = 1;
 float level_percent = 2;
 float temperature_celsius = 3;
 string status = 4;  // charging, discharging, full
 float voltage = 5;
}

// Common messages
message LogEntry {
 google.protobuf.Timestamp timestamp = 1;
 LogLevel level = 2;
 string source = 3;
 string message = 4;
 map<string, string> fields = 5;
}

enum LogLevel {
 LOG_LEVEL_UNSPECIFIED = 0;
 LOG_LEVEL_DEBUG = 1;
 LOG_LEVEL_INFO = 2;
 LOG_LEVEL_WARN = 3;
 LOG_LEVEL_ERROR = 4;
 LOG_LEVEL_FATAL = 5;
}

// Stream messages for bidirectional communication
message InteractionCommand {
 string session_id = 1;
 oneof command {
   TapRequest tap = 2;
   SwipeRequest swipe = 3;
   InputTextRequest input_text = 4;
   WaitCommand wait = 5;
   AssertCommand assert = 6;
 }
}

message WaitCommand {
 oneof condition {
   google.protobuf.Duration duration = 1;
   Locator element_visible = 2;
   Locator element_gone = 3;
 }
 google.protobuf.Duration timeout = 4;
}

message AssertCommand {
 Assertion assertion = 1;
}

message InteractionResult {
 bool success = 1;
 string error_message = 2;
 google.protobuf.Timestamp executed_at = 3;
 google.protobuf.Struct result_data = 4;
}

// Error handling
message ErrorDetail {
 string code = 1;
 string message = 2;
 string details = 3;
 map<string, string> metadata = 4;
 repeated string suggested_actions = 5;
}

message FindElementsRequest {
 string session_id = 1;
 Locator locator = 2;
 string context_element_id = 3;
 google.protobuf.Duration timeout = 4;
 int32 max_results = 5;
}

message FindElementsResponse {
 repeated Element elements = 1;
 int32 total_found = 2;
 string error_message = 3;
}

message GetElementInfoRequest {
 string session_id = 1;
 string element_id = 2;
 repeated string attributes = 3;  // 指定要获取的属性，空则获取全部
}

message ElementInfo {
 Element element = 1;
 map<string, string> computed_styles = 2;
 bool is_displayed = 3;
 bool is_enabled = 4;
 bool is_selected = 5;
 string tag_name = 6;
 string text = 7;
 Rectangle absolute_bounds = 8;  // 相对于屏幕的绝对位置
}

message LongPressRequest {
 string session_id = 1;
 oneof target {
   string element_id = 2;
   Point coordinates = 3;
 }
 google.protobuf.Duration duration = 4;
}

message LongPressResponse {
 bool success = 1;
 string error_message = 2;
 google.protobuf.Timestamp executed_at = 3;
}

message DoubleTapRequest {
 string session_id = 1;
 oneof target {
   string element_id = 2;
   Point coordinates = 3;
 }
 google.protobuf.Duration interval = 4;  // 两次点击之间的间隔
}

message DoubleTapResponse {
 bool success = 1;
 string error_message = 2;
 google.protobuf.Timestamp executed_at = 3;
}

message InputTextRequest {
 string session_id = 1;
 string element_id = 2;
 string text = 3;
 bool clear_first = 4;
 bool hide_keyboard = 5;
}

message InputTextResponse {
 bool success = 1;
 string error_message = 2;
 string actual_text = 3;  // 输入后元素中的实际文本
}

message ClearTextRequest {
 string session_id = 1;
 string element_id = 2;
}

message ClearTextResponse {
 bool success = 1;
 string error_message = 2;
}

message SwipeResponse {
 bool success = 1;
 string error_message = 2;
 google.protobuf.Duration actual_duration = 3;
}

message PinchRequest {
 string session_id = 1;
 oneof target {
   string element_id = 2;
   Rectangle area = 3;
 }
 float scale = 4;  // > 1 放大, < 1 缩小
 google.protobuf.Duration duration = 5;
}

message PinchResponse {
 bool success = 1;
 string error_message = 2;
}

message RotateRequest {
 string session_id = 1;
 oneof target {
   string element_id = 2;
   Point center = 3;
 }
 float degrees = 4;  // 旋转角度
 google.protobuf.Duration duration = 5;
}

message RotateResponse {
 bool success = 1;
 string error_message = 2;
}

message DragRequest {
 string session_id = 1;
 oneof source {
   string element_id = 2;
   Point start_point = 3;
 }
 oneof destination {
   string target_element_id = 4;
   Point end_point = 5;
 }
 google.protobuf.Duration duration = 6;
}

message DragResponse {
 bool success = 1;
 string error_message = 2;
}

message MultiTouchResponse {
 bool success = 1;
 string error_message = 2;
 repeated string executed_actions = 3;
}

// === Device Service 缺失的消息 ===

message GetDeviceRequest {
 string device_id = 1;
}

message ReleaseDeviceRequest {
 string allocation_id = 1;
 string reason = 2;
}

message StreamDeviceStatusRequest {
 string device_id = 1;
 google.protobuf.Duration interval = 2;
}

message DeviceMetrics {
 string device_id = 1;
 ResourceUsage resources = 2;
 map<string, string> custom_metrics = 3;
 google.protobuf.Timestamp timestamp = 4;
}

message StreamDeviceMetricsRequest {
 string device_id = 1;
 repeated string metric_types = 2;
 google.protobuf.Duration interval = 3;
}

// === Session Service 缺失的消息 ===

message GetSessionRequest {
 string session_id = 1;
}

message EndSessionRequest {
 string session_id = 1;
 string reason = 2;
 bool force = 3;
}

message ListSessionsRequest {
 SessionFilter filter = 1;
 int32 page_size = 2;
 string page_token = 3;
}

message SessionFilter {
 repeated string device_ids = 1;
 repeated string app_ids = 2;
 repeated SessionStatus statuses = 3;
 string owner_id = 4;
 google.protobuf.Timestamp created_after = 5;
 google.protobuf.Timestamp created_before = 6;
}

message ListSessionsResponse {
 repeated Session sessions = 1;
 string next_page_token = 2;
 int32 total_count = 3;
}

message SaveSessionStateRequest {
 string session_id = 1;
 string state_name = 2;
 map<string, string> metadata = 3;
}

message RestoreSessionStateRequest {
 string session_id = 1;
 string state_name = 2;
}

// === Screen Service 缺失的消息 ===

message StartRecordingRequest {
 string session_id = 1;
 RecordingOptions options = 2;
}

message RecordingOptions {
 string format = 1;  // mp4, webm, etc.
 int32 fps = 2;
 int32 bitrate = 3;
 bool include_audio = 4;
 google.protobuf.Duration max_duration = 5;
}

message RecordingSession {
 string recording_id = 1;
 string session_id = 2;
 google.protobuf.Timestamp started_at = 3;
 RecordingStatus status = 4;
}

enum RecordingStatus {
 RECORDING_STATUS_UNSPECIFIED = 0;
 RECORDING_STATUS_RECORDING = 1;
 RECORDING_STATUS_PAUSED = 2;
 RECORDING_STATUS_STOPPED = 3;
 RECORDING_STATUS_ERROR = 4;
}

message StopRecordingRequest {
 string recording_id = 1;
}

message Recording {
 string recording_id = 1;
 bytes data = 2;
 string format = 3;
 google.protobuf.Duration duration = 4;
 int64 size_bytes = 5;
 map<string, string> metadata = 6;
}

message GetScreenLayoutRequest {
 string session_id = 1;
 bool include_invisible = 2;
 int32 max_depth = 3;
}

message ScreenLayout {
 Element root_element = 1;
 int32 total_elements = 2;
 string source_format = 3;  // xml, json
 google.protobuf.Timestamp captured_at = 4;
}

message CompareScreensRequest {
 string session_id = 1;
 oneof baseline {
   Screenshot baseline_screenshot = 2;
   string baseline_screenshot_id = 3;
 }
 Screenshot current_screenshot = 4;
 ComparisonOptions options = 5;
}

message ComparisonOptions {
 float similarity_threshold = 1;
 repeated Rectangle ignore_regions = 2;
 bool highlight_differences = 3;
}

message ScreenComparison {
 float similarity_score = 1;
 bool matches = 2;
 repeated DifferenceRegion differences = 3;
 Screenshot diff_image = 4;
}

message DifferenceRegion {
 Rectangle bounds = 1;
 float difference_score = 2;
 string description = 3;
}

message FindVisualElementRequest {
 string session_id = 1;
 oneof target {
   bytes template_image = 2;
   string template_image_url = 3;
 }
 float confidence_threshold = 4;
 bool find_all = 5;
}

message FindVisualElementResponse {
 repeated VisualElement elements = 1;
 bool found = 2;
 string error_message = 3;
}

message VisualElement {
 Rectangle bounds = 1;
 float confidence_score = 2;
 Screenshot matched_region = 3;
}

message StreamLayoutChangesRequest {
 string session_id = 1;
 google.protobuf.Duration debounce_interval = 2;
 repeated string watch_attributes = 3;
}

message LayoutChange {
 repeated ElementChange element_changes = 1;
 google.protobuf.Timestamp timestamp = 2;
 string trigger = 3;  // user_action, app_event, etc.
}

message ElementChange {
 string element_id = 1;
 ChangeType change_type = 2;
 map<string, string> old_attributes = 3;
 map<string, string> new_attributes = 4;
}

enum ChangeType {
 CHANGE_TYPE_UNSPECIFIED = 0;
 CHANGE_TYPE_ADDED = 1;
 CHANGE_TYPE_REMOVED = 2;
 CHANGE_TYPE_MODIFIED = 3;
 CHANGE_TYPE_MOVED = 4;
}

// === Application Service 缺失的消息 ===

message InstallAppRequest {
 string session_id = 1;
 oneof source {
   bytes app_data = 2;
   string app_url = 3;
   string app_path = 4;
 }
 InstallOptions options = 5;
}

message InstallOptions {
 bool allow_downgrade = 1;
 bool grant_permissions = 2;
 bool keep_data = 3;
 map<string, string> extra_args = 4;
}

message InstallAppResponse {
 bool success = 1;
 string app_id = 2;
 string version = 3;
 string error_message = 4;
}

message UninstallAppRequest {
 string session_id = 1;
 string app_id = 2;
 bool keep_data = 3;
}

message LaunchAppRequest {
 string session_id = 1;
 string app_id = 2;
 map<string, string> launch_arguments = 3;
 map<string, string> environment = 4;
 bool wait_for_ready = 5;
}

message LaunchAppResponse {
 bool success = 1;
 string process_id = 2;
 string main_activity = 3;
 string error_message = 4;
}

message TerminateAppRequest {
 string session_id = 1;
 string app_id = 2;
 bool force = 3;
}

message GetAppInfoRequest {
 string session_id = 1;
 string app_id = 2;
}

message AppInfo {
 string app_id = 1;
 string name = 2;
 string version = 3;
 string build_number = 4;
 repeated string permissions = 5;
 int64 size_bytes = 6;
 google.protobuf.Timestamp installed_at = 7;
 map<string, string> metadata = 8;
}

message GetAppStateRequest {
 string session_id = 1;
 string app_id = 2;
}

message AppState {
 string app_id = 1;
 AppStatus status = 2;
 string current_activity = 3;
 repeated string visible_activities = 4;
 map<string, string> state_data = 5;
}

enum AppStatus {
 APP_STATUS_UNSPECIFIED = 0;
 APP_STATUS_NOT_INSTALLED = 1;
 APP_STATUS_NOT_RUNNING = 2;
 APP_STATUS_RUNNING_FOREGROUND = 3;
 APP_STATUS_RUNNING_BACKGROUND = 4;
 APP_STATUS_SUSPENDED = 5;
}

message ResetAppRequest {
 string session_id = 1;
 string app_id = 2;
 ResetLevel level = 3;
}

enum ResetLevel {
 RESET_LEVEL_UNSPECIFIED = 0;
 RESET_LEVEL_CACHE = 1;
 RESET_LEVEL_DATA = 2;
 RESET_LEVEL_FULL = 3;
}

message BackupAppDataRequest {
 string session_id = 1;
 string app_id = 2;
 repeated string data_types = 3;  // preferences, databases, files, etc.
}

message BackupInfo {
 string backup_id = 1;
 string app_id = 2;
 int64 size_bytes = 3;
 google.protobuf.Timestamp created_at = 4;
 map<string, string> metadata = 5;
}

message RestoreAppDataRequest {
 string session_id = 1;
 string backup_id = 2;
 bool overwrite = 3;
}

// === Test Service 缺失的消息 ===

message RunTestSuiteRequest {
 repeated TestCase test_cases = 1;
 TestSuiteOptions options = 2;
}

message TestSuiteOptions {
 int32 max_parallel = 1;
 bool stop_on_failure = 2;
 map<string, string> global_variables = 3;
 repeated string device_ids = 4;
}

message TestSuiteResult {
 string suite_id = 1;
 repeated TestResult test_results = 2;
 TestStatus overall_status = 3;
 google.protobuf.Timestamp started_at = 4;
 google.protobuf.Timestamp completed_at = 5;
 TestSummary summary = 6;
}

message TestSummary {
 int32 total_tests = 1;
 int32 passed = 2;
 int32 failed = 3;
 int32 skipped = 4;
 int32 errors = 5;
 google.protobuf.Duration total_duration = 6;
}

message StreamTestExecutionRequest {
 string test_id = 1;
}

message TestEvent {
 string test_id = 1;
 TestEventType event_type = 2;
 google.protobuf.Timestamp timestamp = 3;
 google.protobuf.Struct data = 4;
}

enum TestEventType {
 TEST_EVENT_TYPE_UNSPECIFIED = 0;
 TEST_EVENT_TYPE_STARTED = 1;
 TEST_EVENT_TYPE_STEP_STARTED = 2;
 TEST_EVENT_TYPE_STEP_COMPLETED = 3;
 TEST_EVENT_TYPE_ASSERTION_PASSED = 4;
 TEST_EVENT_TYPE_ASSERTION_FAILED = 5;
 TEST_EVENT_TYPE_SCREENSHOT_TAKEN = 6;
 TEST_EVENT_TYPE_LOG_ENTRY = 7;
 TEST_EVENT_TYPE_ERROR = 8;
 TEST_EVENT_TYPE_COMPLETED = 9;
}

message CreateTestPlanRequest {
 string name = 1;
 string description = 2;
 repeated TestCase test_cases = 3;
 TestSchedule schedule = 4;
 map<string, string> metadata = 5;
}

message TestSchedule {
 oneof trigger {
   google.protobuf.Timestamp once_at = 1;
   string cron_expression = 2;
   google.protobuf.Duration interval = 3;
 }
 google.protobuf.Timestamp start_date = 4;
 google.protobuf.Timestamp end_date = 5;
}

message TestPlan {
 string plan_id = 1;
 string name = 2;
 string description = 3;
 repeated TestCase test_cases = 4;
 TestSchedule schedule = 5;
 google.protobuf.Timestamp created_at = 6;
 google.protobuf.Timestamp updated_at = 7;
}

message GetTestHistoryRequest {
 TestHistoryFilter filter = 1;
 int32 page_size = 2;
 string page_token = 3;
}

message TestHistoryFilter {
 repeated string test_ids = 1;
 repeated string device_ids = 2;
 repeated TestStatus statuses = 3;
 google.protobuf.Timestamp started_after = 4;
 google.protobuf.Timestamp started_before = 5;
 repeated string tags = 6;
}

message TestHistory {
 repeated TestResult results = 1;
 string next_page_token = 2;
 int32 total_count = 3;
 TestStatistics statistics = 4;
}

message TestStatistics {
 map<string, int32> status_counts = 1;
 float average_duration_seconds = 2;
 float success_rate = 3;
 repeated string most_failed_tests = 4;
 repeated string slowest_tests = 5;
}

message RunParallelTestsRequest {
 repeated ParallelTestJob jobs = 1;
 ParallelTestOptions options = 2;
}

message ParallelTestJob {
 TestCase test_case = 1;
 string device_id = 2;
 map<string, string> variables = 3;
}

message ParallelTestOptions {
 int32 max_concurrent = 1;
 bool fail_fast = 2;
 google.protobuf.Duration timeout = 3;
}

message ParallelTestUpdate {
 string job_id = 1;
 string test_id = 2;
 string device_id = 3;
 TestStatus status = 4;
 string message = 5;
 google.protobuf.Timestamp timestamp = 6;
}

// === System Service 缺失的消息 ===

message RotateDeviceRequest {
 string session_id = 1;
 DeviceOrientation orientation = 2;
}

enum DeviceOrientation {
 DEVICE_ORIENTATION_UNSPECIFIED = 0;
 DEVICE_ORIENTATION_PORTRAIT = 1;
 DEVICE_ORIENTATION_LANDSCAPE = 2;
 DEVICE_ORIENTATION_PORTRAIT_INVERTED = 3;
 DEVICE_ORIENTATION_LANDSCAPE_INVERTED = 4;
}

message SetLocationRequest {
 string session_id = 1;
 double latitude = 2;
 double longitude = 3;
 double altitude = 4;
 double accuracy = 5;
}

message SetNetworkRequest {
 string session_id = 1;
 NetworkCondition condition = 2;
}

message NetworkCondition {
 NetworkType type = 1;
 int32 download_speed_kbps = 2;
 int32 upload_speed_kbps = 3;
 int32 latency_ms = 4;
 float packet_loss_percent = 5;
}

enum NetworkType {
 NETWORK_TYPE_UNSPECIFIED = 0;
 NETWORK_TYPE_WIFI = 1;
 NETWORK_TYPE_CELLULAR_2G = 2;
 NETWORK_TYPE_CELLULAR_3G = 3;
 NETWORK_TYPE_CELLULAR_4G = 4;
 NETWORK_TYPE_CELLULAR_5G = 5;
 NETWORK_TYPE_OFFLINE = 6;
}

message SimulateCallRequest {
 string session_id = 1;
 string phone_number = 2;
 CallAction action = 3;
}

enum CallAction {
 CALL_ACTION_UNSPECIFIED = 0;
 CALL_ACTION_INCOMING = 1;
 CALL_ACTION_ACCEPT = 2;
 CALL_ACTION_REJECT = 3;
 CALL_ACTION_END = 4;
}

message SimulateSMSRequest {
 string session_id = 1;
 string sender = 2;
 string message = 3;
}

message GetSystemLogsRequest {
 string session_id = 1;
 LogFilter filter = 2;
 bool follow = 3;  // tail -f style streaming
}

message LogFilter {
 repeated LogLevel levels = 1;
 repeated string tags = 2;
 repeated string processes = 3;
 google.protobuf.Timestamp since = 4;
 int32 max_lines = 5;
 string grep_pattern = 6;
}

message GetPerformanceMetricsRequest {
 string session_id = 1;
 repeated string metric_types = 2;
 google.protobuf.Duration duration = 3;
 google.protobuf.Duration interval = 4;
}

message DeviceStatusInfo {
 string device_id = 1;
 DeviceStatus status = 2;  // 使用已定义的枚举
 string status_message = 3;
 google.protobuf.Timestamp timestamp = 4;
 map<string, string> details = 5;  // 额外的状态信息
}
