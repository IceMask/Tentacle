# MCP for Appium local-development configuration template.
# Keep this file and local config.yaml in sync for predictable debugging behavior.

gateway:
  port: 8080
  # Local development keeps TLS disabled explicitly.
  # For production-facing defaults, start from config.production.example.yaml instead.
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""
  shutdown_timeout: 30s

orchestrator:
  grpc_port: 9090
  plan_timeout: 10m
  step_timeout: 30s
  auto_wait_max: 5s
  snapshot_ttl: 1.5s
  # monolith: gateway embeds orchestrator execution
  # distributed: standalone orchestrator dispatches to workers
  execution_mode: monolith

worker:
  appium_url: http://127.0.0.1:4723
  concurrency: 4
  heartbeat_interval: 10s
  # Optional routable address advertised to orchestrator for distributed callbacks.
  # Leave empty to derive "<hostname>:<grpc_port>" automatically.
  advertise_addr: ""
  tags:
    platform: android
  orchestrator_addr: 127.0.0.1:9090
  grpc_port: 9092

storage:
  postgres:
    dsn: postgres://postgres:postgres@127.0.0.1:5432/mcp_mobile_worker?sslmode=disable
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 5m

  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0

  s3:
    region: us-east-1
    bucket: mcp-artifacts
    access_key_id: ""
    secret_access_key: ""
    endpoint: ""
    force_path_style: false

websocket:
  subscription_token_ttl: 60s

rpc:
  security:
    # Local development keeps insecure explicitly enabled for convenience.
    # For production-facing defaults, start from config.production.example.yaml instead.
    # insecure | tls | mtls
    mode: insecure
    server_cert_file: ""
    server_key_file: ""
    client_cert_file: ""
    client_key_file: ""
    ca_file: ""
    server_name: ""
    auth_token: ""

auth:
  pat:
    # disabled | static | postgres
    mode: disabled
    # Format: token_id: "sha256_hex|tenant_id|status"
    static_tokens: {}
  oidc:
    issuer_url: ""
    audience: ""
    jwks_url_override: ""
  hmac:
    # disabled | static | postgres
    key_source: disabled
    static_key_id: ""
    static_secret: ""
    window: 5m
    nonce_ttl: 15m

aws:
  region: us-west-2
  # Optional shared profile name (e.g. devicefarm-sso)
  profile: ""

devicefarm:
  # disabled | test_grid | run_api
  mode: disabled
  project_arn: ""
  test_grid_project_arn: ""
  # Applied when mode=test_grid and grid URL is generated
  url_expires_seconds: 600

telemetry:
  log_level: info
  log_file: "/tmp/mcp_for_appium/mcp.log"
  otlp_endpoint: ""
  metrics_port: 9091
