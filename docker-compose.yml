services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mcp
    ports:
      - "5432:5432"
    volumes:
      - ./internal/storage/postgres/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      - redis
      - postgres
      - orchestrator

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "50051:50051"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=50051
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "50052:50052"
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=50052
    depends_on:
      - redis
      - orchestrator
